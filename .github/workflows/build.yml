name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add icon
        run: |
          R=app/src/main/res
          mkdir -p $R/drawable-nodpi $R/mipmap-anydpi-v26
          f=$(git log --diff-filter=A --name-only --pretty=format: -- '*.png' | grep -m1 '\.png$')
          cp "$f" $R/drawable-nodpi/app_logo.png
          cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black"/>
              <foreground>
                  <inset android:drawable="@drawable/app_logo" android:inset="16%"/>
              </foreground>
          </adaptive-icon>
          EOF
          sed -i 's|<application|<application android:icon="@mipmap/ic_launcher"|' app/src/main/AndroidManifest.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShapeLab-apk
          path: app/build/outputs/apk/debug/app-debug.apk
